services:
  - type: web
    name: spendora-preview
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate --workspace backend && npm run start --workspace backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: spendora-preview-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: spendora-preview-db
    databaseName: spendora
    user: spendora
    plan: free
